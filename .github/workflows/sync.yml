name: Synchroniser les applications

# Toutes les 15 minutes : si une application d'apps.txt a une nouvelle version (nouvelle version publiée ou nouveau commit)
# par rapport au site publié (mirrors.json), le site ScoutHub est redéployé. Rien ne change : aucun déploiement.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparer les versions avec le site publié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live=$(curl -fsSL "https://fsggb.github.io/ScoutHub/mirrors.json?t=$(date +%s)" || echo '{}')
          now=$(scripts/versions.sh)
          changed=$(jq -rn --argjson a "$live" --argjson b "$now" '[$b | to_entries[] | select(.value != "inconnue" and .value != ($a[.key] // "")) | .key] | join(" ")')
          if [ -n "$changed" ]; then echo "Applications modifiées : $changed : redéploiement"; gh workflow run pages.yml --ref main
          else echo "Aucun changement"; fi
