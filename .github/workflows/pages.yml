name: Deploy ScoutHub

# ScoutHub assemble sur son propre domaine les applications listées dans apps.txt, chacune dans son dossier,
# comme si elles étaient dans ce dépôt, mais sans les copier : les dépôts restent indépendants et rien n'y est modifié.
# Déclenchement : à chaque changement de ScoutHub, chaque nuit, à la demande, et dès qu'une application change (workflow « Synchroniser »).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Aucun droit par défaut : les compilations exécutent du code de dépôts tiers et ne doivent pas pouvoir publier le site.
permissions: {}

concurrency:
  group: pages
  # ne jamais annuler un déploiement en cours (une compilation Rust dure plus que l'intervalle de synchro)
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # lire les caches de compilation, lancer « Compiler » en arrière-plan
    outputs:
      versions: ${{ steps.v.outputs.versions }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(scripts/versions.sh)
          echo "$versions"
          # Une application dont la nouvelle version n'est pas encore compilée ne bloque plus le site : on publie tout de suite
          # sa version précédente (déjà en cache) et la nouvelle se compile en arrière-plan (workflow « Compiler »), qui
          # relance ce déploiement une fois fini. Sans version précédente en cache, on compile ici comme avant.
          matrix='[]'
          while read -r type dir repo arg; do
            case "$type" in trunk|excali) ;; *) continue ;; esac
            sha=$(jq -r --arg d "$dir" '.[$d]' <<<"$versions")
            use="$sha"
            caches=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=dist-${dir}-&per_page=100" --jq '[.actions_caches[] | select(.ref == "refs/heads/main") | .key]' 2>/dev/null || echo '[]')
            if ! jq -e --arg k "dist-${dir}-${sha}-v1" 'index($k) != null' <<<"$caches" >/dev/null; then
              prev=$(jq -r --arg d "dist-${dir}-" '[.[] | select(startswith($d) and endswith("-v1"))][0] // ""' <<<"$caches")
              if [ -n "$prev" ]; then
                use=${prev#dist-${dir}-}; use=${use%-v1}
                echo "::notice::${dir} : nouvelle version ${sha:0:8} compilée en arrière-plan ; le site garde ${use:0:8} en attendant"
                gh workflow run compiler.yml --ref main -f kind="$type" -f dir="$dir" -f repo="$repo" -f workdir="${arg:-}" -f sha="$sha" || echo "::warning::lancement de la compilation de ${dir} impossible"
                versions=$(jq -c --arg d "$dir" --arg s "$use" '.[$d] = $s' <<<"$versions")
              fi
            fi
            matrix=$(jq -c --arg t "$type" --arg d "$dir" --arg r "$repo" --arg a "${arg:-}" --arg s "$use" '. + [{kind:$t, dir:$d, repo:$r, workdir:$a, sha:$s}]' <<<"$matrix")
          done < <(grep -vE '^\s*(#|$)' apps.txt)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  # Compilations lourdes (Rust → WebAssembly, Excalidraw) : une par application, en parallèle, mises en cache par version
  # du dépôt (un dépôt inchangé n'est pas recompilé). Un échec n'empêche pas le déploiement des autres.
  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: dist-${{ matrix.dir }}-${{ matrix.sha }}-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: src
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src
          shared-key: ${{ matrix.dir }}
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        name: Compiler (Trunk)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          cd "src/${{ matrix.workdir }}"
          trunk build --release --public-url ./
          cd "$GITHUB_WORKSPACE"
          mkdir -p out && cp -a src/dist/web/. out/
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'excali'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'excali'
        name: Compiler (Excalidraw)
        run: |
          npm install --global yarn@1.22.22
          cd src && yarn install --frozen-lockfile && yarn --cwd excalidraw-app vite build --base=./
          cd "$GITHUB_WORKSPACE"; mkdir -p out && cp -a src/excalidraw-app/build/. out/
      - name: Taille du résultat
        run: du -sh out; ls out | head
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.dir }}
          path: out
          retention-days: 1

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
        continue-on-error: true
      - name: Assembler le site
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: |
          mkdir build
          # Le portail (sans le serveur, les docs ni la configuration du dépôt)
          tar -c --exclude='./.git' --exclude='./.github' --exclude='./backend' --exclude='./docs' --exclude='./build' --exclude='./artifacts' --exclude='./scripts' --exclude='*.md' --exclude='./apps.txt' --exclude='./cloudflare' --exclude='./CLAUDE.md' . | tar -x -C build
          # Les applications, telles quelles
          while read -r type dir repo arg; do
            dest="build/${dir}"
            case "$type" in
              static)
                if git clone --depth 1 "https://github.com/${repo}.git" "$dest"; then rm -rf "$dest/.git" "$dest/.github"; else echo "::warning::${dir} : clonage impossible"; fi ;;
              release)
                tmp="$RUNNER_TEMP/rel/${dir}"; mkdir -p "$tmp"
                if gh release download --repo "$repo" --pattern "${arg}-web-*.zip" --dir "$tmp" --clobber && unzip -q "$tmp"/*.zip -d "$tmp/u"; then
                  root=$(find "$tmp/u" -mindepth 1 -maxdepth 1 -type d -print -quit); mkdir -p "$dest"; cp -aL "${root:-$tmp/u}"/. "$dest"/      # -L : les liens internes à l'archive deviennent de vrais fichiers
                  # Certaines versions rangent le chargeur de l'application dans app/ alors qu'il importe ./snippets/ livré à la racine :
                  # on en met une copie à côté de lui (aucun fichier de l'application n'est modifié).
                  if [ -d "$dest/app" ] && [ -d "$dest/snippets" ] && [ ! -e "$dest/app/snippets" ] && grep -qs "from './snippets/" "$dest"/app/*.js; then cp -a "$dest/snippets" "$dest/app/snippets"; fi
                else echo "::warning::${dir} : version publiée introuvable"; fi ;;
              trunk|excali)
                if [ -d "artifacts/app-${dir}" ]; then mkdir -p "$dest"; cp -a "artifacts/app-${dir}"/. "$dest"/; else echo "::warning::${dir} : compilation indisponible"; fi ;;
            esac
          done < <(grep -vE '^\s*(#|$)' apps.txt)
          echo "$VERSIONS" > build/mirrors.json
          # Base de connaissances de ChatGDB : elle vit dans le dépôt ChatGDB (connaissances/src/*.md). On en tire ici la carte
          # index.json et les fiches/*.json, avec le générateur du dépôt ChatGDB lancé SANS réseau, sans lancer d'autre programme
          # et avec le seul droit d'écrire dans connaissances/ (mode « permission » de Node) : ce déploiement a le droit de publier.
          kb="build/ChatGDB/connaissances"
          if [ -f build/ChatGDB/scripts/connaissances.mjs ]; then
            node --permission --allow-fs-read="$PWD/build/ChatGDB" --allow-fs-write="$PWD/$kb" build/ChatGDB/scripts/connaissances.mjs
            # ancienne adresse (…/ScoutHub/connaissances/), pour le serveur Apps Script tant qu'il n'est pas remis à jour
            cp -a "$kb" build/connaissances
            rm -rf build/ChatGDB/connaissances/src build/connaissances/src
          else echo "::warning::ChatGDB : générateur de la base de connaissances introuvable"; fi
          # Fiches de connaissances par application : CHATGDB.md de chaque dépôt (liste dans ChatGDB/connaissances/depots.txt), réunies dans knowledge/
          mkdir -p build/knowledge
          grep -vE '^\s*(#|$)' "$kb/depots.txt" 2>/dev/null | while read -r repo; do
            if curl -fsSL "https://raw.githubusercontent.com/fsggb/${repo}/main/CHATGDB.md" -o "build/knowledge/${repo}.md"; then
              { printf '\n\n<<< Fiche du dépôt %s >>>\n' "$repo"; cat "build/knowledge/${repo}.md"; } >> build/knowledge/all.md
            else echo "::warning::fiche ${repo} introuvable"; rm -f "build/knowledge/${repo}.md"; fi
          done
          # rien d'autre que des fichiers ordinaires : ni lien symbolique (qui pourrait pointer hors du site), ni dépôt git, ni fichier caché
          find build -type l -print -delete
          find build -name '.git*' -prune -exec rm -rf {} + 2>/dev/null || true
          # contrôle : chaque application doit trouver les fichiers que sa page d'accueil référence
          for d in build/*/; do f="${d}index.html"; [ -f "$f" ] || continue
            grep -oE "(href|src)=\"\./[^\" >]+\.(js|wasm)\"" "$f" | grep -oE "\./[^\" >]+" | while read -r p; do [ -e "${d}${p}" ] || echo "::warning::${d} : ${p} manquant"; done
          done
          du -sh build; du -sh build/* | sort -h | tail -8
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
