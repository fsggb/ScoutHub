name: Deploy ScoutHub

# ScoutHub assemble sur son propre domaine les applications listées dans apps.txt, chacune dans son dossier,
# comme si elles étaient dans ce dépôt, mais sans les copier : les dépôts restent indépendants et rien n'y est modifié.
# Déclenchement : à chaque changement de ScoutHub, chaque nuit, à la demande, et dès qu'une application change (workflow « Synchroniser »).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(scripts/versions.sh)
          echo "$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          matrix='[]'
          while read -r type dir repo arg; do
            case "$type" in trunk|excali) matrix=$(jq -c --arg t "$type" --arg d "$dir" --arg r "$repo" --arg a "${arg:-}" --argjson v "$versions" '. + [{kind:$t, dir:$d, repo:$r, workdir:$a, sha:$v[$d]}]' <<<"$matrix") ;; esac
          done < <(grep -vE '^\s*(#|$)' apps.txt)
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  # Compilations lourdes (Rust → WebAssembly, Excalidraw) : une par application, en parallèle, mises en cache par version
  # du dépôt (un dépôt inchangé n'est pas recompilé). Un échec n'empêche pas le déploiement des autres.
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: dist-${{ matrix.dir }}-${{ matrix.sha }}-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: src
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src
          shared-key: ${{ matrix.dir }}
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'trunk'
        name: Compiler (Trunk)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          cd "src/${{ matrix.workdir }}"
          trunk build --release --public-url ./
          cd "$GITHUB_WORKSPACE"
          mkdir -p out && cp -a src/dist/web/. out/
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'excali'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'excali'
        name: Compiler (Excalidraw)
        run: |
          npm install --global yarn@1.22.22
          cd src && yarn install --frozen-lockfile && yarn --cwd excalidraw-app vite build --base=./
          cd "$GITHUB_WORKSPACE"; mkdir -p out && cp -a src/excalidraw-app/build/. out/
      - name: Taille du résultat
        run: du -sh out; ls out | head
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.dir }}
          path: out
          retention-days: 1

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
        continue-on-error: true
      - name: Assembler le site
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: |
          mkdir build
          # Le portail (sans le serveur, les docs ni la configuration du dépôt)
          tar -c --exclude='./.git' --exclude='./.github' --exclude='./backend' --exclude='./docs' --exclude='./build' --exclude='./artifacts' --exclude='./scripts' --exclude='*.md' --exclude='./apps.txt' --exclude='./knowledge-repos.txt' . | tar -x -C build
          # Les applications, telles quelles
          while read -r type dir repo arg; do
            dest="build/${dir}"
            case "$type" in
              static)
                if git clone --depth 1 "https://github.com/${repo}.git" "$dest"; then rm -rf "$dest/.git" "$dest/.github"; else echo "::warning::${dir} : clonage impossible"; fi ;;
              release)
                tmp="$RUNNER_TEMP/rel/${dir}"; mkdir -p "$tmp"
                if gh release download --repo "$repo" --pattern "${arg}-web-*.zip" --dir "$tmp" --clobber && unzip -q "$tmp"/*.zip -d "$tmp/u"; then
                  root=$(find "$tmp/u" -mindepth 1 -maxdepth 1 -type d -print -quit); mkdir -p "$dest"; cp -a "${root:-$tmp/u}"/. "$dest"/
                else echo "::warning::${dir} : version publiée introuvable"; fi ;;
              trunk|excali)
                if [ -d "artifacts/app-${dir}" ]; then mkdir -p "$dest"; cp -a "artifacts/app-${dir}"/. "$dest"/; else echo "::warning::${dir} : compilation indisponible"; fi ;;
            esac
          done < <(grep -vE '^\s*(#|$)' apps.txt)
          echo "$VERSIONS" > build/mirrors.json
          # Fiches de connaissances de ChatGDB : CHATGDB.md de chaque dépôt, réunies dans knowledge/
          mkdir -p build/knowledge
          grep -vE '^\s*(#|$)' knowledge-repos.txt | while read -r repo; do
            if curl -fsSL "https://raw.githubusercontent.com/fsggb/${repo}/main/CHATGDB.md" -o "build/knowledge/${repo}.md"; then
              { printf '\n\n<<< Fiche du dépôt %s >>>\n' "$repo"; cat "build/knowledge/${repo}.md"; } >> build/knowledge/all.md
            else echo "::warning::fiche ${repo} introuvable"; rm -f "build/knowledge/${repo}.md"; fi
          done
          du -sh build; du -sh build/* | sort -h | tail -8
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
