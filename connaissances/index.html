<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base de connaissances</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--fg:#141a33;--mu:#5d6480;--line:#dde1ee;--accent:#1f3a8a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1122;--surface:#151b33;--fg:#e8ebf6;--mu:#9aa2c0;--line:#283153;--accent:#8fa8ff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h1{font-size:20px;margin:0;flex:1 1 200px}input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);flex:1 1 260px}
.wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);min-height:calc(100vh - 70px)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}}
nav{border-right:1px solid var(--line);overflow:auto;padding:8px 0}nav h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 16px 4px}
nav a{display:block;padding:5px 16px;color:var(--fg);text-decoration:none}nav a:hover,nav a.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
nav small{color:var(--mu)}article{padding:16px 24px;max-width:860px;overflow-wrap:anywhere}
article .mu{color:var(--mu)}article a{color:var(--accent)}table{border-collapse:collapse}td,th{border:1px solid var(--line);padding:4px 8px}
.liees a{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
</style></head><body>
<header><h1>Base de connaissances de ChatGDB</h1><input id="q" type="search" placeholder="Chercher une fiche…" aria-label="Chercher"></header>
<div class="wrap"><nav id="nav"></nav><article id="fiche"><p class="mu">Chargement…</p></article></div>
<script>
let idx=null;const voisins={};const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function md(t){const L=esc(t).split('\n');let h='',list=null,tab=false;const fin=()=>{if(list){h+=`</${list}>`;list=null}if(tab){h+='</table>';tab=false}};
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 for(const l of L){let m;if((m=l.match(/^(#{2,4})\s+(.*)/))){fin();h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){fin();h+='<ul>';list='ul'}h+=`<li>${inl(m[1])}</li>`}
  else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){fin();h+='<ol>';list='ol'}h+=`<li>${inl(m[1])}</li>`}
  else if(/^\|/.test(l)){if(/^\|[\s:|-]+\|$/.test(l))continue;if(!tab){fin();h+='<table>';tab=true}h+='<tr>'+l.replace(/^\||\|$/g,'').split('|').map(c=>`<td>${inl(c.trim())}</td>`).join('')+'</tr>'}
  else if(l.trim()===''){fin()}else{fin();h+=`<p>${inl(l)}</p>`}}fin();return h}
function liste(){const q=norm($('#q').value).split(/\s+/).filter(Boolean);const par={};
 for(const f of idx.fiches){const t=norm(f.titre+' '+f.mots_cles.join(' ')+' '+f.resume+' '+f.theme);if(q.every(m=>t.includes(m)))(par[f.theme]||=[]).push(f)}
 $('#nav').innerHTML=Object.keys(par).sort().map(t=>`<h2>${esc(t)} (${par[t].length})</h2>`+par[t].map(f=>`<a href="#${f.id}" data-id="${f.id}">${esc(f.titre)}${f.type==='document'?' <small>· document</small>':''}</a>`).join('')).join('')||'<p style="padding:16px">Aucune fiche.</p>';marque()}
function marque(){const id=location.hash.slice(1);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id))}
async function ouvre(){const id=location.hash.slice(1).replace(/[^a-z0-9-]/g,'');marque();if(!id){$('#fiche').innerHTML=`<p>${idx.nb_fiches} fiches, ${Object.keys(idx.themes).length} thèmes, ${idx.liens.length} liens. Mise à jour : ${new Date(idx.genere).toLocaleString('fr-FR')}.</p><p class="mu">Choisissez une fiche à gauche.</p>`;return}
 try{const f=await (await fetch('fiches/'+id+'.json')).json();
  const src=f.sources.map(s=>`<li>${esc(s.titre||'')}${s.pages?' (p. '+esc(s.pages)+')':''}${s.drive?` · <a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(s.drive)}/view">Drive</a>`:''}${s.url&&/^https?:/.test(s.url)?` · <a target="_blank" rel="noopener" href="${esc(s.url)}">lien</a>`:''}</li>`).join('');
  const li=(voisins[id]||[]).map(v=>{const g=idx.fiches.find(x=>x.id===v);return g?`<a href="#${v}">${esc(g.titre)}</a>`:''}).join('');
  $('#fiche').innerHTML=`<p class="mu">${esc(f.theme)} · ${esc(f.type)}</p><h1>${esc(f.titre)}</h1><p><i>${esc(f.resume)}</i></p>${md(f.contenu)}${src?`<h3>Sources</h3><ul>${src}</ul>`:''}${li?`<h3>Fiches liées</h3><p class="liees">${li}</p>`:''}`;scrollTo(0,0)}
 catch(e){$('#fiche').innerHTML='<p>Fiche introuvable.</p>'}}
fetch('index.json').then(r=>r.json()).then(j=>{idx=j;for(const l of j.liens){(voisins[l.de]||=[]).push(l.vers);(voisins[l.vers]||=[]).push(l.de)}liste();ouvre()}).catch(()=>{$('#fiche').innerHTML='<p>Base indisponible.</p>'});
$('#q').addEventListener('input',liste);addEventListener('hashchange',ouvre);
</script></body></html>
