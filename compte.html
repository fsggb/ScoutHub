<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon compte · ScoutHub</title>
  <link rel="icon" type="image/png" href="assets/fsggb.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <header class="topbar" id="bar"></header>
  <main class="shell narrow">
    <p class="label">ScoutHub</p>
    <h1>Mon compte</h1>

    <section class="panel stack" aria-labelledby="id-title">
      <h2 id="id-title">Identité</h2>
      <dl class="facts">
        <div><dt>Adresse e-mail</dt><dd id="c-email">…</dd></div>
        <div><dt>Profil</dt><dd id="c-role">…</dd></div>
        <div><dt>Fichiers</dt><dd>Les applications enregistrent vos fichiers sur votre appareil, comme à l’origine.</dd></div>
      </dl>
    </section>

    <section class="panel stack" aria-labelledby="pw-title">
      <h2 id="pw-title">Changer mon mot de passe</h2>
      <form id="pw-form" class="form-narrow">
        <label for="pw-old">Mot de passe actuel</label>
        <input id="pw-old" type="password" autocomplete="current-password" required>
        <label for="pw-new">Nouveau mot de passe (8 caractères minimum)</label>
        <input id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
        <label for="pw-new2">Confirmer le nouveau mot de passe</label>
        <input id="pw-new2" type="password" autocomplete="new-password" minlength="8" required>
        <p id="pw-status" class="status" role="status"></p>
        <button class="primary fit" type="submit">Enregistrer</button>
      </form>
    </section>

    <section class="panel stack" aria-labelledby="out-title">
      <h2 id="out-title">Session</h2>
      <p class="muted">La session reste ouverte 30 jours sur cet appareil.</p>
      <button id="logout" class="ghost" type="button">Se déconnecter</button>
    </section>
  </main>
  <footer>ScoutHub · FSGGB · <a href="https://github.com/fsggb/ScoutHub">Code source</a></footer>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="compte.js"></script>
</body>
</html>
